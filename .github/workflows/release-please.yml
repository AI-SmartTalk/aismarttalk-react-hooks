name: Version et publication npm
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_tag:
        description: 'Tag existant à republier après un échec npm (ex. v1.6.2), sinon laisser vide'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: sdk-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      actions: write
      pull-requests: write
    outputs:
      tag: ${{ steps.release.outputs.tag_name || inputs.publish_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run tsc
      - run: npm test -- --runInBand
      - run: npm run test:release
      - run: npm run build
      - uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        id: release
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Déclencher les checks de la MR de version
        if: steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          number=$(printf '%s' "$RELEASE_PR" | jq -r '.number')
          [[ "$number" =~ ^[0-9]+$ ]]
          branch=$(gh pr view "$number" --json headRefName --jq '.headRefName')
          gh workflow run test.yml --ref "$branch"
  publish:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Vérifier le tag publié et son appartenance à main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq 'if .isDraft or .isPrerelease then error("Not a stable release") else true end'
          git merge-base --is-ancestor "$RELEASE_TAG" origin/main
          git checkout --detach "$RELEASE_TAG"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Installer un npm compatible avec Trusted Publishing
        run: npm install --global npm@11.15.0
      - run: npm ci
      - run: npm run tsc
      - run: npm test -- --runInBand
      - run: npm run test:release
      - run: npm run build
      - name: Vérifier la version et éviter une double publication
        id: registry
        run: node scripts/check-release.mjs
      - name: Publier par OIDC
        if: steps.registry.outputs.published != 'true'
        run: npm publish --access public --provenance --ignore-scripts
