name: Tests
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main, fix/visitor-message-delivery]
    # Un brouillon ne lance pas la CI : elle démarre au passage en review.
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run tsc
      - run: npm test -- --runInBand --coverage
      - run: npm run test:release
      - run: npm run build
      - run: npm pack --dry-run --ignore-scripts
