name: Tests
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main, fix/visitor-message-delivery]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run tsc
      - run: npm test -- --runInBand --coverage
      - run: npm run test:release
      - run: npm run build
      - run: npm pack --dry-run --ignore-scripts
